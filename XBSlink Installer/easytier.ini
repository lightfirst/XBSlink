# Easytier toml
instance_name = "xbslink"

# only work with EasyTier-Custom
# sni = "test.ustc.edu.cn"
# parallel_connections = 5

dhcp = true
# ipv4 = "10.126.0.14/16"
listeners = []

[network_identity]
network_name = "easytier_xbs"

network_secret = "easytier_xbs"

[[peer]]
uri = "udp://us01.225284.xyz:11010"

[flags]
dev_name = "ET-xbslink"

latency_first = false

multi_thread = true

default_protocol = "udp"

bind_device = false

disable_upnp = true

data_compress_algo = 2

# only work with EasyTier-Custom
# close_redundant_conns_when_disguised = true
# p2p_disguise_mode = "only"


[[acl.acl_v1.chains]]
name = "Incoming port"
chain_type = "Inbound"
description = "only allow Incoming port and ping"
enabled = true
default_action = "Drop"

[[acl.acl_v1.chains.rules]]
name = "ping"
description = "ping"
priority = 1
enabled = true
protocol = "ICMP"
action = "Allow"

[[acl.acl_v1.chains.rules]]
name = "Incoming port"
description = "Incoming port"
enabled = true
protocol = "UDP"
ports = ["31415"]
action = "Allow"

[acl.acl_v1.group]
